<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>전기의 숲</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <!-- ==================== -->
        <!-- 시작 화면 -->
        <!-- ==================== -->

        <section id="start-screen" class="screen">

            <h1 class="title">
                ⚡ 전기의 숲 ⚡
            </h1>

            <p class="subtitle">
                빛 축제를 부탁해!
            </p>

            <button
                class="start-button"
                onclick="showNameScreen()">

                ✨ 탐험 시작하기 ✨

            </button>

        </section>


        <!-- ==================== -->
        <!-- 이름 입력 화면 -->
        <!-- ==================== -->

        <section id="name-screen" class="screen hidden">

            <h2>
                🌲 전기의 숲 탐험가
            </h2>

            <p>
                탐험가의 이름을 알려주세요.
            </p>

            <input
                id="name-input"
                type="text"
                placeholder="이름을 입력하세요"
                maxlength="10">

            <br><br>

            <button
                class="start-button"
                onclick="startAdventure()">

                🚀 출발!

            </button>

        </section>


        <!-- ==================== -->
        <!-- 게임 화면 -->
        <!-- ==================== -->

        <section id="game-screen" class="screen hidden">

            <h1>
                🌲 전기의 숲 🌲
            </h1>

            <p id="player-name">
                탐험가
            </p>

            <div class="forest-map">

                <div class="tree">🌲</div>
                <div class="tree">🌲</div>
                <div class="character">🧑‍🔬</div>
                <div class="tree">🌲</div>
                <div class="tree">🌲</div>

            </div>

            <p class="mission">
                🔎 숲을 탐험하며 빛 축제를 준비하세요!
            </p>

        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
