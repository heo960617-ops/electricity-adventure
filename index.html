<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>전기의 숲</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="game">


        <!-- ==================== -->
        <!-- 시작 화면 -->
        <!-- ==================== -->

        <section id="start-screen" class="screen">

            <h1 class="title">
                ⚡ 전기의 숲 ⚡
            </h1>

            <p class="subtitle">
                빛 축제를 부탁해!
            </p>

            <button
                class="start-button"
                onclick="showNameScreen()">

                ✨ 탐험 시작하기 ✨

            </button>

        </section>



        <!-- ==================== -->
        <!-- 이름 입력 화면 -->
        <!-- ==================== -->

        <section id="name-screen" class="screen hidden">

            <h2>
                🌲 전기의 숲 탐험가
            </h2>

            <p>
                탐험가의 이름을 알려주세요.
            </p>

            <input
                id="name-input"
                type="text"
                placeholder="이름을 입력하세요"
                maxlength="10">

            <br><br>

            <button
                class="start-button"
                onclick="startAdventure()">

                🚀 출발!

            </button>

        </section>



        <!-- ==================== -->
        <!-- 게임 화면 -->
        <!-- ==================== -->

        <section id="game-screen" class="screen hidden">


            <h1 class="game-title">
                🌲 전기의 숲 🌲
            </h1>


            <p id="player-name">
                탐험가
            </p>

<div class="status-bar">

    <span id="energy-count">
        ⚡ 전기 조각: 0개
    </span>

</div>

            <!-- ==================== -->
            <!-- 숲 지도 -->
            <!-- ==================== -->

            <div class="forest-map">


                <!-- 빛의 마을 -->

                <button
                    class="location light-village"
                    onclick="startDialogue()">

                    <span class="location-icon">
                        💡
                    </span>

                    <span>
                        빛의 마을
                    </span>

                </button>



                <!-- 전지 마을 -->

                <button
                    class="location battery-village"
                    onclick="startBatteryMission()">

                    <span class="location-icon">
                        🔋
                    </span>

                    <span>
                        전지 마을
                    </span>

                </button>



                <!-- 회로 마을 -->

                <button
                    class="location circuit-village"
                    onclick="openLocation('회로 마을')">

                    <span class="location-icon">
                        🔌
                    </span>

                    <span>
                        회로 마을
                    </span>

                </button>



                <!-- 탐험가 -->

                <div class="player">

                    🧑‍🔬

                    <span>
                        나의 위치
                    </span>

                </div>


            </div>



            <p class="mission">
                🔎 숲을 탐험하며 장소를 클릭해보세요!
            </p>



            <!-- ==================== -->
            <!-- 장소 설명창 -->
            <!-- ==================== -->


<!-- ==================== -->
<!-- NPC 대화창 -->
<!-- ==================== -->

<div
    id="dialogue-panel"
    class="dialogue-panel hidden">

    <div class="npc">

        <div class="npc-image">
            💡
        </div>

        <div class="npc-name">
            빛의 마을 주민
        </div>

    </div>


    <div class="dialogue-box">

        <p id="dialogue-text">
            안녕하세요, 탐험가님!
        </p>


        <button
            class="next-button"
            onclick="nextDialogue()">

            다음 ▶

        </button>

    </div>

</div>


            <!-- ==================== -->
<!-- 과학 미션 -->
<!-- ==================== -->

<div
    id="mission-panel"
    class="mission-panel hidden">

    <h2>⚡ 첫 번째 미션</h2>

    <p class="mission-question">
        전구에 불이 켜지려면<br>
        전기가 흐를 수 있는 길이 필요합니다.<br><br>

        다음 중 전기가 흐를 수 있는 길을 만드는 것은 무엇일까요?
    </p>

    <div class="answer-buttons">

        <button onclick="checkAnswer(1)">
            🔴 끊어진 회로
        </button>

        <button onclick="checkAnswer(2)">
            🟢 연결된 회로
        </button>

        <button onclick="checkAnswer(3)">
            🔵 스위치가 항상 열린 회로
        </button>

    </div>

    <p
        id="mission-result"
        class="mission-result">
    </p>

</div>

<!-- ==================== -->
<!-- 전지 마을 미션 -->
<!-- ==================== -->

<div
    id="battery-mission-panel"
    class="mission-panel hidden">

    <h2>🔋 전지 마을의 미션</h2>

    <p class="mission-question">
        전지는 전기 회로에서 어떤 역할을 할까요?
    </p>

    <div class="answer-buttons">

        <button onclick="checkBatteryAnswer(1)">
            💡 전구를 밝히는 빛을 직접 만든다
        </button>

        <button onclick="checkBatteryAnswer(2)">
            ⚡ 전기 에너지를 공급한다
        </button>

        <button onclick="checkBatteryAnswer(3)">
            🔌 전기가 이동하는 길을 만든다
        </button>

    </div>

    <p
        id="battery-mission-result"
        class="mission-result">
    </p>

</div>
            
        </section>


    </main>



    <script src="script.js"></script>

</body>

</html>
