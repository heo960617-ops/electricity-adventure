<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>전기의 숲</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 100px auto;
            padding: 40px;
        }

        h1 {
            font-size: 50px;
        }

        p {
            font-size: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⚡ 전기의 숲 ⚡</h1>

    <p>
        빛 축제를 준비하는 전기의 숲에 놀러오세요!
    </p>

    <button onclick="startAdventure()">
        탐험 시작하기
    </button>

</div>

<script>

function startAdventure() {
    alert("전기의 숲에 오신 것을 환영합니다!");
}

</script>

</body>
</html>
